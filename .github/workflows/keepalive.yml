# Supabase 免費專案連續約 7 天無活動會被自動暫停；每週一、四呼叫 rpc/keepalive（只回傳 ok、不讀任何資料表）以保持運作（零成本）。
# 需在 GitHub → Settings → Secrets and variables → Actions → Variables 設定：
#   VITE_SUPABASE_URL、VITE_SUPABASE_ANON_KEY（皆為公開可見值，非 secret key）
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" && test -n "$KEY" || { echo "請先設定 repository variables"; exit 1; }
          curl -fsS -X POST "$URL/rest/v1/rpc/keepalive" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
